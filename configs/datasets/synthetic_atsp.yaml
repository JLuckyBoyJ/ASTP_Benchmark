# Synthetic ATSP instances — the training set used during heuristic evolution.
#
# Generated by data/generate_atsp.py (implementation in
# solvers/llm/EoH/atsp/data/synthetic.py) and cached under data/synthetic/.
#
# Two generators, one cache. Every family reads and writes the same
# data/synthetic/<family>/atsp_<family>_n<size>_c<count>_s<seed>.npz files, so
# a set is only ever computed once no matter who asks for it:
#
#   python data/generate_atsp.py --all
#       builds every set the EoH configs reference (and is what
#       scripts/setup_environment.sh runs).
#
#   python python_scripts/llm/MCTS-AHD/prepare_data.py --config <name>
#   python python_scripts/llm/MoH/prepare_data.py      --config <name>
#       each builds only what one of its own data configs references, so adding
#       a config there never lengthens anybody else's setup.
#
# Who reads what:
#   EoH        configs/llm/EoH/*.yaml               -> data.train
#   ReEvo      solvers/llm/ReEvo/atsp_utils.py      -> TRAIN_SPLIT
#   MCTS-AHD   configs/llm/MCTS-AHD/cfg/data/*.yaml -> train / val
#   MoH        configs/llm/MoH/cfg/data/*.yaml      -> val (= train; one split)

name: synthetic_atsp
source: synthetic
output_dir: data/synthetic
reference: heuristic        # gaps are relative to a strong reference solver, not a proven optimum

families:
  uniform:
    description: >
      d[i][j] drawn independently from U{1, ..., 1000} for each direction —
      the classical random ATSP benchmark, maximally asymmetric.
    dir: data/synthetic/uniform
    params:
      max_cost: 1000

  asymmetric_clustered:
    description: >
      Clustered 2-D locations give a Euclidean base cost, distorted by a
      per-city elevation so that i -> j costs more than j -> i whenever j is
      higher. Structured, realistic asymmetry (one-way streets, gradients).
    dir: data/synthetic/asymmetric_clustered
    params:
      asymmetry: 0.6
      scale: 1000.0

# Sets generated by `python data/generate_atsp.py --all`; the filename encodes
# family, size, count and seed: atsp_<family>_n<size>_c<count>_s<seed>.npz
default_sets:
  - {family: uniform,              size: 50,  count: 8, seed: 2024, effort: medium}  # construct
  - {family: uniform,              size: 50,  count: 4, seed: 2024, effort: medium}  # rnr
  - {family: uniform,              size: 50,  count: 3, seed: 2024, effort: medium}  # aco
  - {family: asymmetric_clustered, size: 50,  count: 8, seed: 2024, effort: medium}  # gls
  - {family: asymmetric_clustered, size: 200, count: 2, seed: 2024, effort: low}     # gls, large
  - {family: uniform,              size: 200, count: 2, seed: 2024, effort: low}     # gls, large

# Which TSPLIB regime each family imitates, measured as corr(d[i,j], d[j,i]):
#   asymmetric_clustered ~ 0.65  ->  br17, ftv*, p43, ry48p, kro124p  (13 instances)
#   uniform              ~ 0.03  ->  ft53, ft70, rbg*                 (6 instances)
# A training split covering only one regime yields a heuristic that wins on
# only that half of the benchmark, so configs/llm/EoH/atsp_gls.yaml mixes both.

# Budget of the reference solver (multi-start local search + GLS + ruin-and-recreate).
# Counted in iterations, not seconds, so the reference is machine-independent.
reference_effort: medium    # low | medium | high

# Sets referenced by the MCTS-AHD data configs, on top of the defaults above.
# Built by python_scripts/llm/MCTS-AHD/prepare_data.py, into the same cache.
mcts_ahd_sets:
  # cfg/data/synthetic.yaml
  - {family: asymmetric_clustered, size: 50,  count: 8,  seed: 2024, effort: medium}
  - {family: uniform,              size: 200, count: 4,  seed: 2024, effort: low}
  # cfg/data/mcts_ahd_native.yaml — upstream's "many instances at one size"
  # training protocol, and a multi-size validation set
  - {family: uniform,              size: 50,  count: 16, seed: 2024, effort: medium}
  - {family: uniform,              size: 50,  count: 8,  seed: 4048, effort: medium}
  - {family: asymmetric_clustered, size: 200, count: 4,  seed: 4048, effort: low}

# Sets referenced by the MoH data configs, on top of the defaults above.
# Built by python_scripts/llm/MoH/prepare_data.py, into the same cache.
#
# MoH is the only family whose downstream tasks are instance SIZES: one run
# trains a single meta-optimizer against `atsp_gls-50`, `atsp_gls-200`, ... and
# weights their utilities by size (Eq. 2 of the paper). So its sets come in
# matched groups per size rather than as one mixed pool, and the counts are
# small because each subtask is evaluated once per candidate heuristic.
moh_sets:
  # cfg/data/synthetic.yaml — the default two-subtask split
  - {family: asymmetric_clustered,   size: 50,  count: 2, seed: 2024, effort: medium}
  - {family: scheduling_constrained, size: 50,  count: 2, seed: 2024, effort: medium}
  - {family: asymmetric_clustered,   size: 200, count: 1, seed: 2024, effort: low}
  - {family: scheduling_constrained, size: 200, count: 1, seed: 2024, effort: low}
  - {family: uniform,                size: 200, count: 1, seed: 2024, effort: low}
  # cfg/data/multisize.yaml — four subtasks, the paper's TSP20/50/100/200 setting
  - {family: asymmetric_clustered,   size: 100, count: 2, seed: 2024, effort: medium}
  - {family: uniform,                size: 100, count: 1, seed: 2024, effort: medium}
  - {family: scheduling_constrained, size: 400, count: 1, seed: 2024, effort: low}
  - {family: uniform,                size: 400, count: 1, seed: 2024, effort: low}

notes:
  - Every instance is seeded, so regenerating yields byte-identical matrices.
  # NOTE: quoted. An unquoted scalar containing `{...}` is parsed as a YAML flow
  # mapping, which made this whole file fail yaml.safe_load — and every consumer
  # of it fail with it.
  - "Paper-scale training set for GLS is {family: uniform, size: 100, count: 64}."
  # Quoted for the same reason: `rejected: it ...` at the start of a continuation
  # line is a mapping key to YAML, not prose.
  - "A synthetic surrogate for the TSPLIB rbg family was built, measured and
    rejected: it matches rbg on every structural statistic and still ranks
    heuristics differently (rank correlation +0.35 over a ten-heuristic pool).
    That is why the ReEvo and MCTS-AHD defaults train on the real rbg instances
    instead. See configs/llm/MCTS-AHD/cfg/data/tsplib.yaml."
