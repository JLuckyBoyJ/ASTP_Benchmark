# Synthetic ATSP instances — the training set used during heuristic evolution.
#
# Generated by data/generate_atsp.py (implementation in
# solvers/llm/EoH/atsp/data/synthetic.py) and cached under data/synthetic/.
# Solver configs reference this split through their own `data.train` block.

name: synthetic_atsp
source: synthetic
output_dir: data/synthetic
reference: heuristic        # gaps are relative to a strong reference solver, not a proven optimum

families:
  uniform:
    description: >
      d[i][j] drawn independently from U{1, ..., 1000} for each direction —
      the classical random ATSP benchmark, maximally asymmetric.
    dir: data/synthetic/uniform
    params:
      max_cost: 1000

  asymmetric_clustered:
    description: >
      Clustered 2-D locations give a Euclidean base cost, distorted by a
      per-city elevation so that i -> j costs more than j -> i whenever j is
      higher. Structured, realistic asymmetry (one-way streets, gradients).
    dir: data/synthetic/asymmetric_clustered
    params:
      asymmetry: 0.6
      scale: 1000.0

# Sets generated by `python data/generate_atsp.py --all`; the filename encodes
# family, size, count and seed: atsp_<family>_n<size>_c<count>_s<seed>.npz
default_sets:
  - {family: uniform, size: 50, count: 8, seed: 2024}   # construct
  - {family: uniform, size: 50, count: 4, seed: 2024}   # gls, rnr
  - {family: uniform, size: 50, count: 3, seed: 2024}   # aco

# Budget of the reference solver (multi-start local search + GLS + ruin-and-recreate).
# Counted in iterations, not seconds, so the reference is machine-independent.
reference_effort: medium    # low | medium | high

notes:
  - Every instance is seeded, so regenerating yields byte-identical matrices.
  - Paper-scale training set for GLS is {family: uniform, size: 100, count: 64}.
