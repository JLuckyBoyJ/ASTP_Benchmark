# ATSP guided local search: the LLM designs a STATIC "arc badness" guide matrix,
# computed once per instance. Direct counterpart of ReEvo's atsp_gls and of the
# tsp_gls task in the MCTS-AHD paper, on the same engine and the same data.
problem_name: atsp_gls
problem_type: gls
obj_type: min
problem_size: 0
# Two training instances of ~10 s of guided local search each, plus overhead;
# the kill threshold matches configs/llm/ReEvo/cfg/problem/atsp_gls.yaml.
timeout: 300
func_name: heuristics
use_external_knowledge: true
description: Solving the Asymmetric Traveling Salesman Problem (ATSP) via guided local search. ATSP requires finding the shortest closed tour that visits every city once and returns to the start, where the cost of travelling from city i to city j differs from the cost of travelling from j to i.
