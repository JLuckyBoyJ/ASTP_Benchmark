# ATSP greedy construction: the LLM designs the next-city selection rule.
problem_name: atsp_constructive
problem_type: constructive
obj_type: min
problem_size: 0   # 0 = the whole training split; a positive value filters by n
# One greedy pass per instance. The rule is called n-1 times, so the deadline
# only bites on a pathological candidate. Matches configs/llm/ReEvo and
# configs/llm/EoH for the same task.
timeout: 60
func_name: select_next_node
use_external_knowledge: true
description: Solving the Asymmetric Traveling Salesman Problem (ATSP) by constructing a tour step by step. ATSP requires finding the shortest closed tour that visits every city once and returns to the start, where the cost of travelling from city i to city j differs from the cost of travelling from j to i.
