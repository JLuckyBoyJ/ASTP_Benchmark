# Task 2 — guided local search for ATSP (the paper's flagship TSP experiment).
# EoH designs `update_edge_distance`, the rule that reshapes the cost landscape
# so an Or-opt/swap local search escapes its local optimum.
#
#   python python_scripts/llm/EoH/run_eoh_atsp.py --config configs/llm/EoH/atsp_gls.yaml
#
# Paper-scale settings (much slower, needs a bigger LLM budget):
#   --set data.train.size=100 --set data.train.count=64 \
#   --set task.params.time_limit=10 --set task.params.ite_max=1000

extends: base.yaml

task:
  name: gls
  timeout: 180                # a GLS evaluation touches every training instance
  params:
    time_limit: 3.0           # seconds of GLS per instance during evolution
    ite_max: 200
    perturbation_moves: 1
    n_penalise: 5             # most-augmented arcs penalised per perturbation
    n_candidates: 10          # candidate neighbour list size for local search
    max_seg: 3                # longest Or-opt segment

data:
  train:
    source: synthetic
    family: uniform
    size: 50
    count: 4
    seed: 2024

# Longer budget at benchmark time, as in the paper's test protocol.
eval:
  params:
    time_limit: 10.0
    ite_max: 1000
    perturbation_moves: 1
    n_penalise: 5
    n_candidates: 10
    max_seg: 3
