# Task 4 — ruin-and-recreate destroy operator for ATSP.
# EoH designs `destroy_nodes`, which chooses the cities to rip out of the
# incumbent tour before cheapest-insertion rebuilds it.
#
#   python python_scripts/llm/EoH/run_eoh_atsp.py --task rnr
#
# Two design decisions, shared with atsp_gls.yaml:
#
# 1. MIXED TRAINING SET — the benchmark holds two structural regimes.
#    `asymmetric_clustered` reproduces the ftv/kro instances
#    (corr(d[i,j], d[j,i]) ~ 0.6-1.0); `uniform` reproduces the rbg ones
#    (corr ~ 0.03). Training on one alone wins only half the benchmark.
#
# 2. WALL-CLOCK BUDGET (`iter_max` effectively disabled). With an iteration
#    cap, a destroy operator that costs O(n^2) per call is free at n=50 and
#    ruinous at n=443, because evolution never pays for it. Letting
#    `time_limit` be the only budget makes the fitness measure tour quality
#    per second; the n=200 training instances make the search feel it.

extends: base.yaml

task:
  name: rnr
  timeout: 300
  params:
    n_destroy: null           # null => max(2, n // 5)
    iter_max: 1000000         # effectively unlimited: time_limit is the budget
    time_limit: 2.0           # seconds per instance during evolution
    n_candidates: 10
    max_seg: 3

# 20 instances x 2 s = ~40 s per heuristic evaluation.
data:
  train:
    - {source: synthetic, family: asymmetric_clustered, size: 50,  count: 8, seed: 2024, effort: medium}
    - {source: synthetic, family: uniform,              size: 50,  count: 4, seed: 2024, effort: medium}
    - {source: synthetic, family: asymmetric_clustered, size: 200, count: 4, seed: 2024, effort: low}
    - {source: synthetic, family: uniform,              size: 200, count: 4, seed: 2024, effort: low}

eval:
  params:
    n_destroy: null
    iter_max: 1000000
    time_limit: 10.0
    n_candidates: 10
    max_seg: 3

# ── recipes ───────────────────────────────────────────────────────────────────
#
# Cheaper pilot — small instances only, keeps the wall-clock budget:
#   --set 'data.train=[{source: synthetic, family: asymmetric_clustered, size: 50, count: 8}]'
#
# Ablate the destroy size the operator is asked to produce:
#   --set task.params.n_destroy=5
#
# Restore an iteration-bounded budget (the pre-2026 behaviour):
#   --set task.params.iter_max=50 --set task.params.time_limit=100
