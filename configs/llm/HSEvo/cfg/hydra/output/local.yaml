# @package _global_
# ReEvo must be launched from its own directory (upstream resolves problems/
# and prompts/ relative to the working directory), so run outputs are written
# three levels up into the repository's runs/ tree — alongside the EoH runs, so
# both frameworks are inspected and tabulated the same way:
#
#   runs/llm/ReEvo/<problem_name>-<problem_type>/<date>_<time>/
hydra:
  run:
    dir: ../../../runs/llm/ReEvo/${hydra.job.name}/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
  sweep:
    dir: ../../../runs/llm/ReEvo/${hydra.job.name}/${now:%Y-%m-%d}_${now:%H-%M-%S}
    subdir: ${hydra.job.num}_${hydra.job.override_dirname}
