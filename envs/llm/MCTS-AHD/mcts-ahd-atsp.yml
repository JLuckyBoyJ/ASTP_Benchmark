# Conda environment for running MCTS-AHD on the ATSP benchmark.
#   conda env create -f envs/llm/MCTS-AHD/mcts-ahd-atsp.yml
#   conda activate mcts-ahd-atsp
#
# The pip section is the whole extra dependency list: Hydra for the config
# system and its colorlog plugin, and the OpenAI client. Upstream's torch /
# botorch / gpytorch / gymnasium / numba pins belong to the tasks the ATSP
# retarget removed, and the ATSP engines are plain NumPy.
name: mcts-ahd-atsp
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy>=1.24
  - pyyaml>=6.0
  - pytest>=7.4
  - pip
  - pip:
      - hydra-core>=1.3.2
      - hydra-colorlog>=1.2.0
      - omegaconf>=2.3
      - openai>=1.10
